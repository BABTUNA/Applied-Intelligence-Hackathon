<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <radialGradient id="ambient" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#C5FF00" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#C5FF00" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#C5FF00" stop-opacity="0"/>
    </radialGradient>
    <filter id="caret-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="1.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#C5FF00" stroke-width="0.5" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#0A0B0A"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <ellipse cx="600" cy="150" rx="520" ry="180" fill="url(#ambient)"/>

  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700">
    <text x="600" y="172" text-anchor="middle" font-size="86" fill="#F2F2EE" letter-spacing="-2">
      <tspan fill="#C5FF00" opacity="0.55">[ </tspan>evernav<tspan fill="#C5FF00" filter="url(#caret-glow)">▮</tspan><tspan fill="#C5FF00" opacity="0.55"> ]</tspan>
    </text>
  </g>

  <g font-family="'Inter', system-ui, sans-serif">
    <text x="600" y="222" text-anchor="middle" font-size="17" fill="#7C817D" letter-spacing="2">
      LIVE AGENT NAVIGATION FOR HOSTILE WEB UIs
    </text>
  </g>

  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#7C817D" letter-spacing="1.2">
    <text x="40" y="272">v0.1.0</text>
    <text x="600" y="272" text-anchor="middle">claude vision · insforge · chrome MV3</text>
    <text x="1160" y="272" text-anchor="end">2026</text>
  </g>
</svg>
